<?xml version="1.0" encoding="UTF-8"?>
<svg width="291px" height="320px" viewBox="0 0 291 320" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <g stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <g>
            <text font-family="Geist-Regular, Geist" font-size="11" font-weight="normal" line-spacing="13" fill="#636363">
                <tspan x="41" y="11">x² 表示边长为 x 的</tspan>
                <tspan x="41" y="24">正方形面积。</tspan>
            </text>
            <line x1="95.5" y1="33.5" x2="95.5" y2="95.5" stroke="#636363" stroke-linecap="round"></line>
            <line x1="95.5" y1="33.5" x2="95.5" y2="95.5" stroke="#BABABA" stroke-linecap="round"></line>
            <line x1="95.5" y1="207.5" x2="95.5" y2="269.5" stroke="#BABABA" stroke-linecap="round"></line>
            <rect fill="#e6e6e6" x="175" y="188" width="40" height="39"></rect>
            <rect stroke="#333333" stroke-width="2" x="57" y="69" width="118" height="118"></rect>
            <rect stroke="#333333" x="175.5" y="68.5" width="39" height="119"></rect>
            <rect stroke="#333333" transform="translate(116.000000, 207.000000) rotate(90.000000) translate(-116.000000, -207.000000) " x="96.5" y="147.5" width="39" height="119"></rect>
            <text font-family="Geist-Regular, Geist" font-size="11" font-weight="normal" line-spacing="13" fill="#636363">
