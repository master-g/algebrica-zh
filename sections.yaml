    description_en: |
      This section collects the main theorems of differential calculus that describe the behavior of differentiable functions. Topics include foundational results such as Rolle’s theorem, the Mean Value Theorem, and related statements that connect derivatives with the global properties of functions on an interval.
    description_zh: |
      介绍刻画可微函数行为的主要定理，包括罗尔定理、中值定理及其相关结论。

