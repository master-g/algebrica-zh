      - binomial-equations
      - trinomial-equations
      - rational-equations
      - irrational-equations
      - absolute-value-equations
      - exponential-equations
      - logarithmic-equations
      - homogeneous-trigonometric-equations
      - trigonometric-equations
      - equations-with-parameters
      - linear-equations-with-parameters
      - quadratic-equations-with-parameters
    description_en: |
      An equation is a mathematical equality between two expressions containing one or more variables, called unknowns. Solving an equation means finding all its solutions in the definition set of the variables.
    description_zh: |
      介绍含有一个或多个未知量的等式，以及在变量定义域内求出全部解的方法。

  - dir: inequalities
