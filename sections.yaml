      - natural-numbers
      - integers
      - modulo-operator
      - rational-numbers
      - irrational-numbers
      - real-numbers
      - properties-of-real-numbers
      - absolute-value
      - intervals
      - supremum-and-infimum
      - factorial
      - binomial-coefficient
    description_en: |
      Archive of topics on sets and number systems, including natural numbers, integers, rational and irrational numbers, and the structure of the real and complex number systems.
    description_zh: |
      集合与数系主题，包括自然数、整数、有理数、无理数，以及实数系与复数系的结构。

  - dir: algebraic-structures
    name_en: "Algebraic Structures"
    name_zh: 代数结构
    order: 2
    entries:
      - groups
      - rings
      - fields
      - vector-spaces
      - modules
      - homomorphisms-and-isomorphisms
    description_en: |
      
    description_zh: |
      介绍群、环、域、向量空间与模等代数结构，以及保持这些结构的同态与同构。

  - dir: powers-radicals-logarithms
    name_en: "Powers, Radicals and Logarithms"
    name_zh: 幂根与对数
    order: 3
    entries:
      - powers
      - radicals
      - logarithms
    description_en: |
      Entries on powers, radicals, and logarithms, covering exponent rules \(a^n\), root expressions \(\sqrt[n]{a}\), and logarithmic relationships \(\log_b x = y \iff b^y = x\).
    description_zh: |
      介绍幂、根式与对数，包括指数运算法则、根式表达式和对数关系。

  - dir: complex-numbers
    name_en: "Complex Numbers"
    name_zh: 复数
    order: 4
    entries:
      - complex-numbers
      - complex-number-operations
      - complex-numbers-trigonometric-form
      - euler-formula
      - complex-numbers-exponential-form
      - de-moivre-theorem
      - roots-of-unity
      - complex-number-fundamental-inequalities
      - complex-logarithm
    description_en: |
      Complex numbers extend the real number system by introducing the imaginary unit \(I\), defined by \(i^2 = -1\). A complex number has the form \(z = a + bi\) with \(a, b \in \mathbb{R}\). This section covers their algebraic properties, geometric representation in the complex plane, modulus, conjugation, and polar form \(z = r(\cos \theta + i \sin \theta)\).
    description_zh: |
      复数将实数系扩展到包含虚数单位。本编介绍复数的代数性质、复平面上的几何表示、模、共轭与极坐标形式。

  - dir: trigonometry
    name_en: Trigonometry
    name_zh: 三角学
    order: 5
    entries:
      - angles-and-angular-measure
      - unit-circle
      - sine-and-cosine
      - tangent-and-cotangent
      - secant-and-cosecant
      - arcsine-and-arccosine
      - arctangent-and-arccotangent
      - hyperbolic-sine-and-cosine
      - hyperbolic-tangent-and-cotangent
      - hyperbolic-secant-and-cosecant
      - pythagorean-theorem
      - trigonometric-identities
      - hyperbolic-identities
      - pythagorean-identity
      - right-triangle-trigonometry
      - reduction-formulas-and-reference-angles
      - law-of-sines
      - law-of-cosines
    description_en: |
      This section collects topics on trigonometry, the branch of mathematics that studies the relationships between angles and sides of triangles and the trigonometric functions that arise from them. The entries explore functions such as sine, cosine, and tangent, their properties, identities, and applications in geometry and analysis.
    description_zh: |
      研究三角形的边角关系及由此产生的三角函数，包括正弦、余弦、正切及其性质、恒等式和应用。

  - dir: polynomials
    name_en: Polynomials
    name_zh: 多项式
    order: 6
    entries:
      - polynomials
      - monomials
      - binomials
      - trinomials
      - adding-and-subtracting-polynomials
      - multiplying-polynomials
      - polynomial-division
      - synthetic-division
      - roots-of-a-polynomial
      - vieta-formulas
      - binomial-theorem
      - completing-the-square
      - factoring-polynomials-ac-method
      - unique-factorization-of-polynomials
      - notable-products
      - partial-fraction-decomposition
    description_en: |
      A polynomial is a mathematical expression made up of terms consisting of a coefficient and a variable raised to a power, which are then summed together.
    description_zh: |
      介绍由系数与变量幂构成的多项式，以及多项式的运算、因式分解、根与基本定理。

