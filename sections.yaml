      - maximum-minimum-and-inflection-points
      - partial-derivatives
    description_en: |
      Derivatives measure how a function changes with respect to its variable and describe the instantaneous rate of change of \(f(x)\). The derivative of a function is defined by the limit: \[ f'(x)=\lim_{h\to0}\frac{f(x+h)-f(x)}{h} \]
    description_zh: |
      导数刻画函数相对于自变量的瞬时变化率。本编介绍导数的定义、计算规则与几何应用。

