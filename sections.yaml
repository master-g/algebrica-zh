      - parabola
      - circumference
      - ellipse
      - hyperbola
    description_en: |
      This section collects topics from analytic geometry concerning lines, planes, and conic sections. The entries explore the algebraic representation of geometric objects in the coordinate plane and the study of curves such as circles, parabolas, ellipses, and hyperbolas. These concepts connect geometric shapes with equations and provide the foundation for analyzing curves and intersections in the Cartesian plane.
    description_zh: |
      介绍解析几何中的直线、平面与圆锥曲线，研究几何对象的代数表示及其交点与性质。

  - dir: vectors-and-matrices
