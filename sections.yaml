      - change-of-basis-matrix
      - eigenvalues-and-eigenvectors
      - matrix-diagonalization
    description_en: |
      Vectors and matrices in basic linear algebra, including vector representation and operations, matrix notation ( A = (a_{ij}) ), dimensions ( m times n ), matrix operations, determinants, and linear transformations.
    description_zh: |
      介绍线性代数中的向量与矩阵，包括表示、运算、行列式、秩、特征值和线性变换。

