      - polynomial-inequalities
      - linear-inequalities
      - quadratic-inequalities
      - geometric-interpretation-quadratic-inequalities
      - sign-analysis-in-inequalities
      - rational-inequalities
      - irrational-inequalities
      - exponential-inequalities
      - logarithmic-inequalities
      - inequalities-with-absolute-value
      - trigonometric-inequalities
      - loss-of-solutions-in-inequalities
      - systems-of-inequalities
    description_en: |
      Archive of topics on mathematical inequalities, covering methods to compare algebraic expressions, solve inequalities, and describe ranges of values that satisfy given conditions.
    description_zh: |
      介绍代数表达式的大小比较、不等式的求解方法，以及满足给定条件的取值范围。

  - dir: lines-planes-conic-sections
    name_en: "Lines, Planes and Conic Sections"
    name_zh: 直线平面与圆锥曲线
    order: 9
